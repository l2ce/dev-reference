name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      L2CE_SOURCE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm data:build
      - run: pnpm run database import
      - run: pnpm --filter @l2ce/web lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /dev-reference
          SITE_URL: https://l2ce.github.io
      - run: pnpm release:pack
      - run: pnpm release:check
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-package
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  storage-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      L2CE_SOURCE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:build
      - run: pnpm --filter @l2ce/database test
